pipeline:
  name: spring-boot-ci
  identifier: springbootci
  projectIdentifier: LBGHarnessTraining
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GITHUB_TEST_connector
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Maven Compile and Package
                  identifier: Maven_Compile_and_Package
                  spec:
                    connectorRef: DOCKERHUB_TOKEN_ZUBAIR
                    image: maven:3.9.9-eclipse-temurin-21
                    shell: Bash
                    command: |-
                      cd SmallestSpringApp
                      mvn -B clean package -DskipTests
                      Use code with caution
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build And Push Docker hub
                  identifier: Build_And_Push_Docker_hub
                  spec:
                    connectorRef: DOCKERHUB_TOKEN_ZUBAIR
                    repo: syedzubair555/springboot-sample-rep
                    tags:
                      - latest
                    dockerfile: " SmallestSpringApp/Dockerfile"
                    context: SmallestSpringApp
    - stage:
        name: Deploy to Minikube
        identifier: Deploy_to_Minikube
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: springbootservice
          environment:
            environmentRef: Development
            deployToAll: false
            infrastructureDefinitions:
              - identifier: Development
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback

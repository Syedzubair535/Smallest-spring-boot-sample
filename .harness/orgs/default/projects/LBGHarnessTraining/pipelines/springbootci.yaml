pipeline:
  name: spring-boot-ci
  identifier: springbootci
  projectIdentifier: LBGHarnessTraining
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GITHUB_TEST_connector
        build: <+input>
  stages:
    - stage:
        name: Build and Package
        identifier: Build_and_Package
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Maven Compile and Package
                  identifier: Maven_Compile_and_Package
                  spec:
                    connectorRef: DOCKERHUB_TOKEN_ZUBAIR
                    image: maven:3.9.9-eclipse-temurin-21
                    shell: Sh
                    command: |-
                      cd SmallestSpringApp
                      mvn -B clean package -DskipTests
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push to Docker Hub
                  identifier: Build_and_Push_to_Docker_Hub
                  spec:
                    connectorRef: DOCKERHUB_TOKEN_ZUBAIR
                    repo: syedzubair555/springboot-sample-repo
                    tags:
                      - latest
                    dockerfile: " SmallestSpringApp/Dockerfile"
                    context: SmallestSpringApp
